name: Player
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Player:
    type: application
    platform: iOS
    sources: [Player, Shared]
    dependencies:
      - target: PlayerWidget
    entitlements:
      path: Player/Player.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.player]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.player
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconBlue IconPurple IconGreen IconOrange IconBlack"
    info:
      path: Player/Info.plist
      properties:
        CFBundleDisplayName: Player
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ALTAppGroups: [group.com.example.player]
  PlayerWidget:
    type: app-extension
    platform: iOS
    sources: [PlayerWidget, Shared]
    entitlements:
      path: PlayerWidget/PlayerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.player]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.player.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: "YES"
    info:
      path: PlayerWidget/Info.plist
      properties:
        CFBundleDisplayName: Player
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ALTAppGroups: [group.com.example.player]
