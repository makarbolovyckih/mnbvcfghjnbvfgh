name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          # Locate sources + spec wherever they ended up in the repo
          APP=$(find . -name PlayerApp.swift -not -path './build/*' | head -1)
          [ -n "$APP" ] || { echo "PlayerApp.swift not found"; find . -not -path './.git/*'; exit 1; }
          SRC=$(dirname "$APP" | sed 's|^\./||')
          echo "Sources dir: $SRC"
          cat > project.yml <<EOF
          name: Player
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              MARKETING_VERSION: "1.0"
              CURRENT_PROJECT_VERSION: "1"
          targets:
            Player:
              type: application
              platform: iOS
              sources: [$SRC]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.player
                  TARGETED_DEVICE_FAMILY: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconBlue IconPurple IconGreen IconOrange IconBlack"
              info:
                path: $SRC/Info.plist
                properties:
                  CFBundleDisplayName: Player
                  UILaunchScreen: {}
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UIBackgroundModes: [audio]
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
          EOF
          cat project.yml
          xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Player.xcodeproj -scheme Player -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Player.app Payload/
          zip -r Player.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Player-ipa
          path: Player.ipa
